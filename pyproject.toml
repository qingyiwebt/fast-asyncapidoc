[project]
name = "fast-asyncapidoc"
version = "0.1.0"
description = "Generate AsyncAPI 3 documentation for FastAPI WebSocket endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
